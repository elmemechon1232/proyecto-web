<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 448" width="762" height="448" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Mapa del sector cordillerano — Ruta G-25</title>
  <desc id="desc">Mapa de senderos con la Ruta G-25, el Río de las Nieves, el Centro de Visitantes CONAF, el Refugio Las Cumbres, el Mirador Glaciar y el control de acceso en el kilómetro cero.</desc>

  <style>
    /* ===== PALETA CÁLIDA Y TERROSA =====
       Cambiar un valor aquí lo cambia en todo el mapa. */
    svg {
      --papel:        #efe4d2;   /* fondo del mapa */
      --papel-borde:  #3b2f24;   /* marco exterior */
      --ficha:        #fdf8ef;   /* cajas de etiqueta y leyenda */
      --ficha-borde:  #d6c3a4;   /* borde de las cajas */
      --tinta:        #3a2e22;   /* texto principal */
      --curva-nivel:  #c2ac8b;   /* curvas de nivel punteadas */
      --ruta-base:    #4a3826;   /* cuerpo de la ruta */
      --ruta-linea:   #d9a441;   /* marcas de la ruta */
      --agua:         #85aba0;   /* río */
      --agua-tinta:   #3f6b60;   /* rótulo del río */
      --bosque:       #4a5a2b;   /* CONAF y guardaparques */
      --sendero:      #6f8438;   /* senderos autorizados */
      --oxido:        #a8452f;   /* mirador y aguja del norte */
      --ocre:         #8c6239;   /* refugio */
      --piedra:       #6b5a45;   /* control de acceso */
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .et      { font-size: 13px; font-weight: 700; }
    .leyenda { font-size: 12.5px; fill: var(--tinta); }
    .rio     { font-size: 13.5px; font-style: italic; font-weight: 600; fill: var(--agua-tinta); }
  </style>

  <defs>
    <clipPath id="marco">
      <rect x="6" y="6" width="750" height="436" rx="16"/>
    </clipPath>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#3b2f24" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ===== FONDO ===== -->
  <rect x="6" y="6" width="750" height="436" rx="16" fill="var(--papel)"/>

  <g clip-path="url(#marco)">

    <!-- ===== CURVAS DE NIVEL ===== -->
    <g fill="none" stroke="var(--curva-nivel)" stroke-width="1.6" stroke-dasharray="7 6" stroke-linecap="round" opacity="0.8">
      <path d="M 30 270 C 140 184, 300 132, 452 126 C 592 120, 692 150, 756 190"/>
      <path d="M 52 300 C 168 232, 312 188, 452 184 C 578 180, 676 202, 756 238"/>
      <path d="M 250 96 C 372 78, 520 84, 620 118 C 690 142, 730 180, 748 226"/>
      <path d="M 120 330 C 236 292, 356 262, 470 250 C 580 238, 668 246, 756 272"/>
    </g>

    <!-- ===== RÍO DE LAS NIEVES ===== -->
    <path d="M -14 206 C 62 214, 122 236, 192 252 C 262 268, 322 292, 402 304
             C 472 314, 542 308, 602 292 C 652 279, 702 268, 776 256"
          fill="none" stroke="var(--agua)" stroke-width="12" stroke-linecap="round"/>

    <!-- ===== RUTA G-25 ===== -->
    <!-- Dos trazos superpuestos: el cuerpo oscuro y encima las marcas ocres. -->
    <g fill="none" stroke-linecap="round">
      <path d="M 44 408 C 140 338, 248 256, 300 222
               C 336 198, 366 190, 404 189
               C 460 186, 500 178, 528 166
               C 580 144, 610 120, 646 88
               C 676 60, 702 40, 732 20"
            stroke="var(--ruta-base)" stroke-width="7"/>
      <path d="M 44 408 C 140 338, 248 256, 300 222
               C 336 198, 366 190, 404 189
               C 460 186, 500 178, 528 166
               C 580 144, 610 120, 646 88
               C 676 60, 702 40, 732 20"
            stroke="var(--ruta-linea)" stroke-width="3.4" stroke-dasharray="9 8"/>
    </g>

    <!-- ===== SENDERO AL MIRADOR ===== -->
    <path d="M 452 141 C 478 122, 504 100, 527 84"
          fill="none" stroke="var(--sendero)" stroke-width="3.6"
          stroke-dasharray="3 5" stroke-linecap="round"/>
  </g>

  <!-- ===== RÓTULO DEL RÍO ===== -->
  <text class="rio" x="503" y="312" text-anchor="middle">Río de las Nieves</text>

  <!-- ===== MARCADORES ===== -->
  <!-- Control de acceso -->
  <circle cx="55" cy="400" r="8" fill="var(--piedra)" stroke="var(--ficha)" stroke-width="2"/>
  <!-- Refugio -->
  <circle cx="227" cy="229" r="7" fill="var(--ficha)" stroke="var(--ocre)" stroke-width="4"/>
  <!-- Mirador -->
  <circle cx="531" cy="78" r="7" fill="var(--ficha)" stroke="var(--oxido)" stroke-width="4"/>
  <!-- Centro de visitantes -->
  <circle cx="402" cy="190" r="14" fill="var(--bosque)" opacity="0.22"/>
  <circle cx="402" cy="190" r="7" fill="var(--ficha)" stroke="var(--bosque)" stroke-width="4"/>

  <!-- ===== ETIQUETAS ===== -->
  <!-- Mirador Glaciar -->
  <g filter="url(#sombra)">
    <rect x="446" y="45" width="168" height="27" rx="6" fill="var(--ficha)" stroke="var(--oxido)" stroke-width="2"/>
  </g>
  <text class="et" x="530" y="63.5" text-anchor="middle" fill="var(--oxido)">Mirador Glaciar (3.200m)</text>

  <!-- Centro de Visitantes -->
  <g filter="url(#sombra)">
    <rect x="298" y="146" width="212" height="30" rx="7" fill="var(--bosque)"/>
  </g>
  <text class="et" x="404" y="166" text-anchor="middle" fill="#fdf8ef">Centro de Visitantes (CONAF)</text>

  <!-- Refugio Las Cumbres -->
  <g filter="url(#sombra)">
    <rect x="152" y="245" width="155" height="27" rx="6" fill="var(--ficha)" stroke="var(--ocre)" stroke-width="2"/>
  </g>
  <text class="et" x="229.5" y="263.5" text-anchor="middle" fill="var(--ocre)">Refugio Las Cumbres</text>

  <!-- Control de Acceso -->
  <g filter="url(#sombra)">
    <rect x="72" y="388" width="164" height="26" rx="5" fill="var(--ficha)" stroke="var(--ficha-borde)" stroke-width="1.5"/>
  </g>
  <text class="et" x="154" y="405.5" text-anchor="middle" fill="var(--tinta)" style="font-size:12.5px">Control de Acceso Km 0</text>

  <!-- ===== LEYENDA ===== -->
  <g filter="url(#sombra)">
    <rect x="20" y="22" width="196" height="92" rx="9" fill="var(--ficha)" stroke="var(--ficha-borde)" stroke-width="1.5"/>
  </g>
  <circle cx="38" cy="44" r="6.5" fill="var(--bosque)"/>
  <text class="leyenda" x="55" y="48.5">Guardaparques</text>

  <line x1="28" y1="68" x2="49" y2="68" stroke="var(--ruta-base)" stroke-width="5.5" stroke-linecap="round"/>
  <text class="leyenda" x="55" y="72.5">Ruta G-25 Principal</text>

  <line x1="28" y1="91" x2="49" y2="91" stroke="var(--sendero)" stroke-width="3.6"
        stroke-dasharray="3 4.5" stroke-linecap="round"/>
  <text class="leyenda" x="55" y="95.5">Senderos Autorizados</text>

  <!-- ===== ROSA DE LOS VIENTOS ===== -->
  <g filter="url(#sombra)">
    <circle cx="678" cy="378" r="29" fill="var(--ficha)" stroke="var(--ficha-borde)" stroke-width="2"/>
  </g>
  <path d="M 678 353 L 685.5 386 L 678 380 L 670.5 386 Z" fill="var(--oxido)"/>
  <path d="M 678 403 L 685.5 386 L 678 392 L 670.5 386 Z" fill="var(--piedra)" opacity="0.75"/>

  <!-- ===== MARCO ===== -->
  <rect x="6" y="6" width="750" height="436" rx="16" fill="none"
        stroke="var(--papel-borde)" stroke-width="3"/>
</svg>
