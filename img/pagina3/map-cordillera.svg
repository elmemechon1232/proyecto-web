<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="350" role="img" aria-label="Mapa esquemático del Valle Cordillerano">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9ecef" />
      <stop offset="100%" stop-color="#dee2e6" />
    </linearGradient>
  </defs>

  <!-- Fondo topográfico esquemático -->
  <rect width="600" height="350" fill="url(#mapBg)" rx="8" />

  <!-- Curvas de nivel / relieve -->
  <path d="M 50,300 Q 150,180 300,200 T 550,150" fill="none" stroke="#ced4da" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 30,220 Q 200,100 400,140 T 580,70" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 80,120 Q 250,50 450,80 T 570,30" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Río de montaña / Estero cordillerano -->
  <path d="M 0,160 C 150,170 200,250 350,220 S 500,290 600,280" fill="none" stroke="#48cae4" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <text x="360" y="245" font-family="'Segoe UI', sans-serif" font-size="11" fill="#0077b6" font-style="italic">Río de las Nieves</text>

  <!-- Ruta Principal (Camino vehicular pavimentado) -->
  <path d="M 20,330 C 120,300 180,180 320,150 S 480,120 560,40" fill="none" stroke="#4a4e69" stroke-width="6" stroke-linecap="round" />
  <path d="M 20,330 C 120,300 180,180 320,150 S 480,120 560,40" fill="none" stroke="#ffb703" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round" />

  <!-- Sendero Trekking Glaciar (Línea punteada verde) -->
  <path d="M 320,150 Q 370,100 420,60" fill="none" stroke="#2d6a4f" stroke-width="3" stroke-dasharray="5,5" />

  <!-- Punto 1: Centro de Informaciones y Guardaparques (Destacado) -->
  <g transform="translate(320, 150)">
    <circle cx="0" cy="0" r="14" fill="#1b4332" opacity="0.2" />
    <circle cx="0" cy="0" r="9" fill="#1b4332" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <rect x="-85" y="-38" width="170" height="26" rx="4" fill="#1b4332" />
    <text x="0" y="-21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Centro de Visitantes (CONAF)</text>
  </g>

  <!-- Punto 2: Refugio y Hospedajes -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="7" fill="#2b7a9b" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <rect x="-60" y="12" width="120" height="22" rx="4" fill="#ffffff" stroke="#2b7a9b" stroke-width="1" />
    <text x="0" y="27" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#2b7a9b" text-anchor="middle">Refugio Las Cumbres</text>
  </g>

  <!-- Punto 3: Base Trekking Glaciar -->
  <g transform="translate(420, 60)">
    <circle cx="0" cy="0" r="7" fill="#e63946" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <rect x="-65" y="-28" width="130" height="22" rx="4" fill="#ffffff" stroke="#e63946" stroke-width="1" />
    <text x="0" y="-13" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#e63946" text-anchor="middle">Mirador Glaciar (3.200m)</text>
  </g>

  <!-- Punto 4: Entrada y Retén de Carabineros -->
  <g transform="translate(40, 320)">
    <circle cx="0" cy="0" r="6" fill="#495057" />
    <rect x="15" y="-12" width="130" height="20" rx="3" fill="#ffffff" stroke="#ced4da" />
    <text x="80" y="2" font-family="'Segoe UI', sans-serif" font-size="10" fill="#212529" text-anchor="middle">Control de Acceso Km 0</text>
  </g>

  <!-- Rosa de los vientos / Brújula -->
  <g transform="translate(540, 300)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5" />
    <polygon points="0,-18 5,-2 0,0 -5,-2" fill="#e63946" />
    <polygon points="0,18 5,2 0,0 -5,2" fill="#6c757d" />
    <text x="0" y="-6" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#e63946" text-anchor="middle">N</text>
    <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-size="8" fill="#6c757d" text-anchor="middle">S</text>
  </g>

  <!-- Leyenda en el mapa -->
  <rect x="15" y="15" width="150" height="70" rx="5" fill="#ffffff" opacity="0.92" stroke="#dee2e6" />
  <circle cx="28" cy="30" r="4" fill="#1b4332" />
  <text x="40" y="34" font-family="'Segoe UI', sans-serif" font-size="10" fill="#2b2d42">Guardaparques</text>
  <line x1="22" y1="48" x2="35" y2="48" stroke="#4a4e69" stroke-width="3" />
  <text x="40" y="52" font-family="'Segoe UI', sans-serif" font-size="10" fill="#2b2d42">Ruta G-25 Principal</text>
  <line x1="22" y1="66" x2="35" y2="66" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="3,2" />
  <text x="40" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#2b2d42">Senderos Autorizados</text>
</svg>
